name: TooToo v0.2.3 macOS release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-v0.2.3.yml']

permissions: {}
concurrency:
  group: tootoo-release-v0.2.3
  cancel-in-progress: false

env:
  BASE_COMMIT: 3845f416900a7c011270d8b1948f14ade67b8c2a
  ZIP_NAME: TooToo-v0.2.3-macos-universal.zip

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.verify.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm exact source
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "uuuyuqi/tootoo"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$BASE_COMMIT"
          git diff --quiet "$BASE_COMMIT" HEAD -- . \
            ':(exclude).github/workflows/release-v0.2.3.yml' ':(exclude)README.md' ':(exclude)macos/build_app.sh'
          git show "$BASE_COMMIT:README.md" | sed 's/TooToo-v0\.2\.2-macos-universal\.zip/TooToo-v0.2.3-macos-universal.zip/g' | cmp - README.md
          git show "$BASE_COMMIT:macos/build_app.sh" | sed -e 's/VERSION:-0\.2\.2/VERSION:-0.2.3/' -e 's/BUILD_NUMBER:-4/BUILD_NUMBER:-5/' | cmp - macos/build_app.sh
      - name: Run Python and Node regression suites
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m unittest discover -s tests -v
          node --test tests/*.test.cjs
      - name: Verify real TooToo assertions on macOS
        run: |
          set -euo pipefail
          smoke="$(mktemp -d)"
          trap 'rm -rf "$smoke"' EXIT
          swiftc -O -D TOOTOO_KEEP_AWAKE_SMOKE -framework AppKit -framework WebKit \
            -framework Foundation -framework IOKit macos/main.swift -o "$smoke/TooToo"
          python3 tests/keep_awake_macos.py "$smoke/TooToo"
      - name: Build the official Universal archive
        env:
          VERSION: '0.2.3'
          BUILD_NUMBER: '5'
          TOOTOO_DEBUG: '0'
          UNIVERSAL: '1'
          PACKAGE_ZIP: '1'
          NO_INSTALL: '1'
        run: bash macos/build_app.sh
      - name: Verify packaged app
        id: verify
        run: |
          set -euo pipefail
          temp="$(mktemp -d)"
          trap 'rm -rf "$temp"' EXIT
          unzip -tq "dist/$ZIP_NAME"
          ditto -x -k "dist/$ZIP_NAME" "$temp"
          app="$temp/TooToo.app"
          test "$(find "$temp" -maxdepth 1 -name '*.app' -print)" = "$app"
          binary="$app/Contents/MacOS/TooToo"
          lipo "$binary" -verify_arch arm64 x86_64
          lipo "$binary" -archs
          plist="$app/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$plist")" = "0.2.3"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$plist")" = "5"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$plist")" = "com.tootoo.telemetry"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$plist")" = "TooToo"
          test -f "$app/Contents/Resources/.release"
          packaged_ui="$app/Contents/Resources/ui"
          if grep -q 'id="debugBar"' "$packaged_ui/index.html"; then
            echo 'Debug panel leaked into the release HTML' >&2
            exit 1
          fi
          grep -Fq '/*__TOOTOO_DEBUG_FLAG__*/false' "$packaged_ui/index.html"
          node - "$packaged_ui/index.html" <<'JS'
          const fs = require("node:fs"), vm = require("node:vm");
          const html = fs.readFileSync(process.argv[2], "utf8");
          let checked = 0;
          for (const m of html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)) {
            if (m[1].trim()) new vm.Script(m[1], { filename: "packaged-index-inline-" + (++checked) });
          }
          if (!checked) throw new Error("No packaged inline scripts verified");
          console.log("Packaged inline JavaScript syntax verified:", checked);
          JS
          mkdir -p "$temp/fixture/tests" "$temp/fixture/ui"
          cp tests/home_preview_ui.test.cjs "$temp/fixture/tests/"
          cp "$packaged_ui/index.html" "$packaged_ui/tootoo_catalog.js" "$temp/fixture/ui/"
          node --test "$temp/fixture/tests/home_preview_ui.test.cjs"
          strings "$binary" > "$temp/native-strings.txt"
          if grep -E 'TOOTOO_KEEP_AWAKE_CI_READY|TOOTOO_KEEP_AWAKE_CI_SUITE|--keep-awake-ci|TooToo-Debug Keep Awake|setDebugTier' "$temp/native-strings.txt"; then
            echo 'Test/debug controls leaked into the release binary' >&2
            exit 1
          fi
          grep -q 'TooToo Keep Awake (AI Coding)' "$temp/native-strings.txt"
          grep -q 'id="keepAwakeBtn"' "$app/Contents/Resources/ui/index.html"
          codesign --verify --deep --strict --verbose=2 "$app"
          (cd dist && shasum -a 256 -c "$ZIP_NAME.sha256")
          digest="$(shasum -a 256 "dist/$ZIP_NAME" | awk '{print $1}')"
          echo "sha256=$digest" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tootoo-v0.2.3-verified-zip
          path: dist/${{ env.ZIP_NAME }}
          if-no-files-found: error
          compression-level: 0

  publish:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tootoo-v0.2.3-verified-zip
      - name: Publish the verified archive and exact source tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ZIP_SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "uuuyuqi/tootoo"
          test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_SHA"
          [[ "$ZIP_SHA256" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "$ZIP_SHA256" "$ZIP_NAME" | sha256sum -c -
          test -z "$(git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" refs/tags/v0.2.3)"
          gh release create v0.2.3 "$ZIP_NAME" --target "$GITHUB_SHA" --title 'TooToo v0.2.3' --notes '商城里未拥有的普通、精工物品仍可试摆或试穿；奢华及以上和隐藏款不提供免费预览。购买、租房和已拥有物品的使用不受影响。开发调试版可与正式版独立运行，下载包仅包含正式版。'
          test "$(gh api "repos/$GH_REPO/git/ref/tags/v0.2.3" --jq '.object.sha')" = "$GITHUB_SHA"
          gh release view v0.2.3 --json url,tagName,isDraft,assets
