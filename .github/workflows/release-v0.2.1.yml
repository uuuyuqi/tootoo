name: TooToo v0.2.1 macOS release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-v0.2.1.yml']

permissions: {}
concurrency:
  group: tootoo-release-v0.2.1
  cancel-in-progress: false

env:
  APP_COMMIT: 52d4021cd3f5c2abda582d2abe84f7132b85a427
  ZIP_NAME: TooToo-v0.2.1-macos-universal.zip

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.verify.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm exact source
        run: |
          git merge-base --is-ancestor "$APP_COMMIT" HEAD
          git diff --quiet "$APP_COMMIT" HEAD -- . ':(exclude).github/workflows/release-v0.2.1.yml'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Run quota regression tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m unittest discover -s tests -v
          node --test tests/quota_ui.test.cjs
      - name: Build the official Universal archive
        env:
          VERSION: '0.2.1'
          BUILD_NUMBER: '3'
          UNIVERSAL: '1'
          PACKAGE_ZIP: '1'
          NO_INSTALL: '1'
        run: bash macos/build_app.sh
      - name: Verify packaged app
        id: verify
        run: |
          set -euo pipefail
          temp="$(mktemp -d)"
          ditto -x -k "dist/$ZIP_NAME" "$temp"
          app="$temp/TooToo.app"
          binary="$app/Contents/MacOS/TooToo"
          lipo "$binary" -verify_arch arm64 x86_64
          lipo "$binary" -archs
          plist="$app/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$plist")" = "0.2.1"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$plist")" = "3"
          test -f "$app/Contents/Resources/.release"
          codesign --verify --deep --strict --verbose=2 "$app"
          (cd dist && shasum -a 256 -c "$ZIP_NAME.sha256")
          digest="$(shasum -a 256 "dist/$ZIP_NAME" | awk '{print $1}')"
          echo "sha256=$digest" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tootoo-v0.2.1-verified-zip
          path: dist/${{ env.ZIP_NAME }}
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tootoo-v0.2.1-verified-zip
      - name: Publish the verified archive and exact source tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ZIP_SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "uuuyuqi/tootoo"
          test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_SHA"
          [[ "$ZIP_SHA256" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "$ZIP_SHA256" "$ZIP_NAME" | sha256sum -c -
          test -z "$(git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" refs/tags/v0.2.1)"
          gh release create v0.2.1 "$ZIP_NAME" --target "$GITHUB_SHA" --title 'TooToo v0.2.1' --notes '修复 Codex 周额度丢失：忽略空额度记录，修复旧缓存，并兼容 CODEX_HOME。网页和 macOS 菜单栏优先显示 Codex 周额度，未检测到选中的来源时改为显示其他官方额度；关闭设置保持不变。'
          test "$(gh api "repos/$GH_REPO/git/ref/tags/v0.2.1" --jq '.object.sha')" = "$GITHUB_SHA"
          gh release view v0.2.1 --json url,tagName,isDraft,assets
