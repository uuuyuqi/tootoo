name: TooToo 0.2.6 arcade and audio verification

on:
  push:
    branches: ['feature/tootoo-arcade-v0.2.6']
    paths:
      - .github/workflows/verify-arcade-v0.2.6.yml
      - macos/**
      - tests/**
      - ui/**
      - pricing.py
      - scanner.py
      - server.py
      - update_check.py
      - VERSION

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15-intel
    timeout-minutes: 20
    env:
      ZIP_NAME: TooToo-v0.2.6-macos-universal.zip
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify source and all regression tests
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 21512c529442feca0677857029d7308733861f78 HEAD
          test "$(cat VERSION)" = 0.2.6
          python3 -m unittest discover -s tests -v
          node --test tests/*.test.cjs
          bash -n macos/build_app.sh
      - name: Verify native URL allowlist and real Keep Awake
        run: |
          set -euo pipefail
          smoke="$(mktemp -d)"
          trap 'rm -rf "$smoke"' EXIT
          swiftc -O -framework AppKit macos/UpdateController.swift tests/update_native_contract.swift -o "$smoke/contract"
          "$smoke/contract"
          swiftc -O -D TOOTOO_KEEP_AWAKE_SMOKE -framework AppKit -framework WebKit \
            -framework Foundation -framework IOKit macos/main.swift macos/UpdateController.swift -o "$smoke/TooToo"
          python3 tests/keep_awake_macos.py "$smoke/TooToo"
      - name: Build normal Universal ZIP and authoritative checksum
        env:
          VERSION: '0.2.6'
          BUILD_NUMBER: '8'
          TOOTOO_DEBUG: '0'
          UNIVERSAL: '1'
          PACKAGE_ZIP: '1'
          NO_INSTALL: '1'
        run: bash macos/build_app.sh
      - name: Test actual staged ZIP and rollback with disposable apps
        run: |
          set -euo pipefail
          unzip -tq "dist/$ZIP_NAME"
          (cd dist && shasum -a 256 -c "$ZIP_NAME.sha256")
          python3 tests/update_install_macos.py "dist/$ZIP_NAME" "dist/$ZIP_NAME.sha256"
      - name: Verify packaged official configuration and source UI
        run: |
          set -euo pipefail
          fixture="$(mktemp -d)"
          trap 'rm -rf "$fixture"' EXIT
          ditto -x -k "dist/$ZIP_NAME" "$fixture"
          app="$fixture/TooToo.app"
          plist="$app/Contents/Info.plist"
          res="$app/Contents/Resources"
          test "$(find "$fixture" -maxdepth 1 -name '*.app' -print)" = "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$plist")" = "0.2.6"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$plist")" = "8"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$plist")" = "com.tootoo.telemetry"
          test -f "$res/.release" && test -f "$res/update_install.py"
          test "$(cat "$res/VERSION")" = 0.2.6
          lipo "$app/Contents/MacOS/TooToo" -verify_arch arm64 x86_64
          codesign --verify --deep --strict "$app"
          grep -Fq '/*__TOOTOO_DEBUG_FLAG__*/false' "$res/ui/index.html"
          if grep -Eq 'id="debugBar"|TOOTOO_DEV_DEBUG_(START|END)|TOOTOO_DEV_DEBUG_JS_(START|END)' "$res/ui/index.html"; then
            echo 'Development-only UI leaked into release HTML' >&2
            exit 1
          fi
          strings "$app/Contents/MacOS/TooToo" > "$fixture/bin-strings"
          if grep -Eq 'TOOTOO_KEEP_AWAKE_CI_READY|--keep-awake-ci|setDebugTier' "$fixture/bin-strings"; then
            echo 'Development/test entry point leaked into release executable' >&2
            exit 1
          fi
          node - "$res/ui/index.html" <<'JS'
          const fs=require("node:fs"), vm=require("node:vm");
          const html=fs.readFileSync(process.argv[2],"utf8");
          let count=0;
          for (const m of html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)) {
            if (m[1].trim()) new vm.Script(m[1], {filename:"app-inline-" + (++count)});
          }
          if (!count) throw new Error("No inline scripts verified");
          JS
          mkdir "$fixture/tests" "$fixture/ui"
          cp "$res/ui/index.html" "$res/ui/tootoo_catalog.js" "$fixture/ui/"
          cp tests/*.test.cjs "$fixture/tests/"
          node --test "$fixture/tests/"*.test.cjs
          shasum -a 256 "dist/$ZIP_NAME" "dist/$ZIP_NAME.sha256"
      - name: Test native popover lifecycle with the packaged UI
        run: |
          set -euo pipefail
          smoke="$(mktemp -d)"
          trap 'if [[ -n "${server_pid:-}" ]]; then kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true; fi; rm -rf "$smoke"' EXIT
          swiftc -parse-as-library -swift-version 5 -framework AppKit -framework WebKit tests/ArcadePopoverSmoke.swift -o "$smoke/arcade-popover-smoke"
          ditto -x -k "dist/$ZIP_NAME" "$smoke"
          mkdir "$smoke/home" "$smoke/state" "$smoke/codex"
          res="$smoke/TooToo.app/Contents/Resources"
          env HOME="$smoke/home" TOOTOO_HOME="$smoke/state" CODEX_HOME="$smoke/codex" \
            python3 "$res/server.py" --no-open --host 127.0.0.1 --port 17897 > "$smoke/server.log" 2>&1 &
          server_pid=$!
          ready=0
          for ((i=0; i<30; i++)); do
            if curl -fsS --max-time 1 http://127.0.0.1:17897/ >/dev/null 2>&1; then ready=1; break; fi
            sleep 1
          done
          if [[ "$ready" != 1 ]]; then cat "$smoke/server.log"; exit 1; fi
          "$smoke/arcade-popover-smoke" 'http://127.0.0.1:17897/?mode=popover'
      - name: Verify Debug remains check-only
        env:
          VERSION: '0.2.6'
          BUILD_NUMBER: '8'
          TOOTOO_DEBUG: '1'
          UNIVERSAL: '0'
          PACKAGE_ZIP: '0'
          NO_INSTALL: '1'
        run: |
          set -euo pipefail
          bash macos/build_app.sh
          app="dist/TooToo-Debug.app"
          test -f "$app/Contents/Resources/update_check.py"
          test ! -e "$app/Contents/Resources/update_install.py"
          test ! -e "$app/Contents/Resources/.release"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Contents/Info.plist")" = "com.tootoo.telemetry.debug"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tootoo-v0.2.6-verified-zip
          path: |
            dist/TooToo-v0.2.6-macos-universal.zip
            dist/TooToo-v0.2.6-macos-universal.zip.sha256
          if-no-files-found: error
          compression-level: 0
