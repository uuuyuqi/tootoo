name: Publish verified TooToo v0.2.22
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-v0.2.22.yml']
permissions: {}
concurrency:
  group: tootoo-release-v0.2.22
  cancel-in-progress: false
env:
  VERIFIED_SHA: '127580a2a4cae599a8696be60c95bf754d85f79e'
  VERIFIED_RUN: '45821512271'
  VERIFIED_ARTIFACT: '15118258090'
  VERIFIED_ARTIFACT_DIGEST: 'sha256:e168b1c0d3660e79ff98f9e340d6f1ab81cdbda562e3ac79abae3edfaf80f0bc'
  ARTIFACT_NAME: tootoo-v0.2.22-verified-zip
  EXPECTED_SHA256: 'cebd707c442f4c8e47f5b83bb2d2d76f63e4bf5fb46a3fb9ffeef18eed66dc13'
  ZIP_NAME: TooToo-v0.2.22-macos-universal.zip
  TAG: v0.2.22
jobs:
  publish:
    if: github.repository == 'uuuyuqi/tootoo' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm exact source, successful verification and immutable artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$VERIFIED_SHA"
          git diff --exit-code "$VERIFIED_SHA" HEAD -- . ':(exclude).github/workflows/release-v0.2.22.yml'
          gh api "repos/$GH_REPO/actions/runs/$VERIFIED_RUN" | jq -e \
            --arg sha "$VERIFIED_SHA" \
            '.head_sha == $sha and .head_branch == "verification/tootoo-v0.2.22" and
             (.path | split("@")[0]) == ".github/workflows/verify-adventure-release-v0.2.22.yml" and
             .event == "push" and .status == "completed" and .conclusion == "success"'
          gh api "repos/$GH_REPO/actions/artifacts/$VERIFIED_ARTIFACT" | jq -e \
            --arg sha "$VERIFIED_SHA" --arg name "$ARTIFACT_NAME" \
            --arg digest "$VERIFIED_ARTIFACT_DIGEST" --argjson run "$VERIFIED_RUN" \
            '.digest == $digest and .name == $name and .expired == false
             and .workflow_run.id == $run and .workflow_run.head_sha == $sha'
          test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_SHA"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ env.ARTIFACT_NAME }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.VERIFIED_RUN }}
          path: verified
      - name: Publish the verified ZIP and checksum
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd verified
          [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]]
          cmp "$ZIP_NAME.sha256" <(printf '%s  %s\n' "$EXPECTED_SHA256" "$ZIP_NAME")
          sha256sum --strict -c "$ZIP_NAME.sha256"
          test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_SHA"
          test -z "$(git ls-remote "$GITHUB_SERVER_URL/$GH_REPO.git" "refs/tags/$TAG")"
          gh release create "$TAG" "$ZIP_NAME" "$ZIP_NAME.sha256" --draft --target "$GITHUB_SHA" \
            --title 'TooToo v0.2.22' \
            --notes '重新平衡弹药打 Bug：减少无敌、补弹与缓存返弹，增加敌人的数量与耐打程度。两款大冒险游戏共用票券，每天首次进入送 3 张，5 萝卜币买 1 张，每日限购 5 张，单张 7 天有效。未解锁的舞台背景不显示名字、图标或配色。安装包使用 ad-hoc 签名，未经过 Apple 公证。'
          check_dir="$(mktemp -d)"
          trap 'rm -rf "$check_dir"' EXIT
          gh release download "$TAG" -p "$ZIP_NAME" -p "$ZIP_NAME.sha256" -D "$check_dir"
          cmp "$ZIP_NAME" "$check_dir/$ZIP_NAME"
          cmp "$ZIP_NAME.sha256" "$check_dir/$ZIP_NAME.sha256"
          test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_SHA"
          gh release edit "$TAG" --draft=false --latest
          test "$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq '.object.sha')" = "$GITHUB_SHA"
          gh release view "$TAG" --json url,tagName,isDraft,assets
