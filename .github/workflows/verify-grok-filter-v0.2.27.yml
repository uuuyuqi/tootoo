name: Verify TooToo v0.2.27 Grok Bot tool filtering
on:
  push:
    branches: ['verification/tootoo-v0.2.27-grok-filter']
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15-intel
    timeout-minutes: 20
    env:
      ZIP_NAME: TooToo-v0.2.27-macos-universal.zip
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
      - name: Python and Node regressions
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(cat VERSION)" = 0.2.27
          python3 -W error::SyntaxWarning -m unittest discover -s tests -v
          node --test tests/*.test.cjs
          bash -n macos/build_app.sh
      - name: Compile and package Release (Universal)
        env:
          TOOTOO_DEBUG: '0'
          UNIVERSAL: '1'
          PACKAGE_ZIP: '1'
          NO_INSTALL: '1'
        run: |
          set -euo pipefail
          bash macos/build_app.sh
          unzip -tq "dist/$ZIP_NAME"
          (cd dist && shasum -a 256 -c "$ZIP_NAME.sha256" && cat "$ZIP_NAME.sha256")
          python3 - "dist/$ZIP_NAME" <<'PY'
          import sys, zipfile
          from macos.update_install import zip_entries
          with zipfile.ZipFile(sys.argv[1]) as archive:
              assert len(list(zip_entries(archive))) == len(archive.namelist())
          PY
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          ditto -x -k "dist/$ZIP_NAME" "$stage"
          app="$stage/TooToo.app"
          lipo "$app/Contents/MacOS/TooToo" -verify_arch arm64 x86_64
          codesign --verify --deep --strict --all-architectures -R '=identifier "com.tootoo.telemetry"' "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Contents/Info.plist")" = 0.2.27
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$app/Contents/Info.plist")" = 29
          res="$app/Contents/Resources"
          cmp scanner.py "$res/scanner.py"
          cmp server.py "$res/server.py"
          mkdir -p "$res/tests"
          cp tests/grokbot_ui.test.cjs tests/droid_credits_ui.test.cjs "$res/tests/"
          (
            cd "$res"
            node --test tests/grokbot_ui.test.cjs tests/droid_credits_ui.test.cjs
            node - ui/index.html <<'JS'
          const fs = require('node:fs'), vm = require('node:vm');
          const ui = fs.readFileSync(process.argv[2], 'utf8');
          for (const [, js] of ui.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)) new vm.Script(js);
          JS
          )
      - name: Compile standalone Debug
        env:
          TOOTOO_DEBUG: '1'
          UNIVERSAL: '0'
          NO_INSTALL: '1'
        run: |
          set -euo pipefail
          bash macos/build_app.sh
          app=dist/TooToo-Debug.app
          test -x "$app/Contents/MacOS/TooToo-Debug"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Contents/Info.plist")" = com.tootoo.telemetry.debug
          test ! -e "$app/Contents/Resources/update_install.py"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tootoo-v0.2.27-grok-filter-verified-zip
          path: |
            dist/TooToo-v0.2.27-macos-universal.zip
            dist/TooToo-v0.2.27-macos-universal.zip.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
